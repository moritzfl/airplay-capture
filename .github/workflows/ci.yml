name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          check-latest: true
      - uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      # ffmpeg and its ~80 libraries come from the runner's Ubuntu mirror, which can take minutes.
      # Keep the downloaded packages; apt still installs them properly, it only skips the download.
      - name: Key for the cached ffmpeg packages
        id: apt-key
        run: |
          echo "prefix=apt-ffmpeg-${ImageOS}-" >> "$GITHUB_OUTPUT"
          echo "key=apt-ffmpeg-${ImageOS}-${ImageVersion}" >> "$GITHUB_OUTPUT"

      - name: Restore cached ffmpeg packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/apt-archives
          key: ${{ steps.apt-key.outputs.key }}
          # A newer runner image starts from the previous packages and downloads only what changed.
          restore-keys: ${{ steps.apt-key.outputs.prefix }}

      - name: Install ffmpeg (needed by media and end-to-end tests)
        run: |
          mkdir -p ~/apt-archives/partial
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive NEEDRESTART_MODE=a \
            apt-get install -y --no-install-recommends -o Dir::Cache::archives="$HOME/apt-archives" ffmpeg
          sudo chmod -R a+r ~/apt-archives
          ffmpeg -hide_banner -version | head -1

      - name: Set up Node.js (prettier-java formatting check)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26

      - name: Check formatting
        run: ./gradlew spotlessCheck

      # The tests need no web client bundle; building it would add ~15 s to every run.
      - name: Run tests
        run: ./gradlew test -x vaadinBuildFrontend -x copyVaadinBundle

  # The release builds and pushes the images only after a tag exists. Building them here as well
  # catches a base image the Gradle toolchain cannot use, or a package that is gone, in the pull
  # request instead of in a release that has already been tagged.
  images:
    # The release workflow calls this workflow and builds the same images right after it.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Built for the runner's platform only: the jar is built once on the build platform for every
      # architecture, so this covers the toolchain, and the release adds arm64. The layer cache of
      # main is also what a release tag can read, which speeds up its build stage.
      - name: Build the Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          tags: airplay-capture:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the Synology runtime image from the jar in that image
        run: |
          mkdir -p "$RUNNER_TEMP/spk"
          id=$(docker create airplay-capture:ci)
          docker cp "$id:/app/app.jar" "$RUNNER_TEMP/spk/app.jar"
          docker rm "$id"
          docker build --file packaging/Dockerfile.runtime --output type=cacheonly "$RUNNER_TEMP/spk"
