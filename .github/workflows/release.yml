name: Release

# Pushing a version tag (e.g. 1.0.0) on GitHub runs the tests, builds the
# Synology SPK and the runnable jar, publishes Docker images and creates a
# GitHub Release.
on:
  push:
    tags: ['*']

permissions:
  contents: write
  packages: write

jobs:
  # Fails before anything is built or pushed when CHANGELOG.md has no entry for the tag.
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/changelog-section.mjs "${GITHUB_REF_NAME}"

  test:
    needs: changelog
    uses: ./.github/workflows/ci.yml

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Use the tag as the application version
        run: |
          echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          sed -i "s/^version = .*/version = \"${GITHUB_REF_NAME#v}\"/" build.gradle.kts

      - name: Set up QEMU and buildx (multi-arch images)
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Only move latest when this is the highest version tag
        id: latest
        run: |
          git fetch --tags --force origin
          highest=$(git tag --list | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          echo "highest version tag: $highest; this tag: ${GITHUB_REF_NAME}"
          if [ "$highest" = "${GITHUB_REF_NAME}" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.latest.outputs.latest }}

      - name: Build and push images (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out the SPK framework
        uses: actions/checkout@v7
        with:
          repository: moritzfl/synology-docker-bridge
          ref: d91ad4f1294921a0db6c6956d593f9445092a4b7
          path: synology-docker-bridge

      - name: Set up Java 21 and Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node.js 22 (SPK generator)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up QEMU and buildx for ARM packages
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Use the tag as the version (the SPK build reads it from build.gradle.kts)
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          sed -i "s/^version = .*/version = \"$VERSION\"/" build.gradle.kts

      - name: Build the Synology packages
        env:
          FRAMEWORK_DIR: ${{ github.workspace }}/synology-docker-bridge
        run: |
          ARCH=x86_64 ./packaging/pack-framework.sh
          ARCH=armv8 ./packaging/pack-framework.sh

      - name: Checksums for the release assets
        run: |
          jar=$(ls build/libs/airplay-capture-*.jar)
          sha256sum "$jar" packaging/dist/airplay-capture-*-x86_64.spk packaging/dist/airplay-capture-*-armv8.spk > release-checksums.txt

      - name: Release notes from CHANGELOG.md
        run: |
          {
            node scripts/changelog-section.mjs "${GITHUB_REF_NAME}"
            echo
            echo "## Install"
            echo
            echo "- **Synology NAS** (DSM 7.2.1+, Container Manager): install the x86_64 or armv8 \`.spk\` in Package Center → Manual Install. The armv8 package has not yet been tested on a real ARM NAS."
            echo "- **Docker** (linux/amd64, linux/arm64): \`docker run ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}\`"
            echo "- **Standalone:** the \`.jar\` needs Java 21 and ffmpeg."
            echo
            echo "SHA-256 checksums: \`release-checksums.txt\`."
          } > release-notes.md

      - name: Create the GitHub Release with the SPK and the jar
        uses: softprops/action-gh-release@v2
        with:
          name: AirPlay Capture ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            packaging/dist/airplay-capture-*-x86_64.spk
            packaging/dist/airplay-capture-*-armv8.spk
            build/libs/airplay-capture-*.jar
            release-checksums.txt
