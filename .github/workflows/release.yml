name: Release

# Pushing a version tag (e.g. 1.0.0) on GitHub runs the tests, builds the
# Synology SPK and the runnable jar, publishes Docker images and creates a
# GitHub Release.
on:
  push:
    tags: ['*']

permissions:
  contents: read

jobs:
  # Fails before anything is built or pushed when CHANGELOG.md has no entry for the tag.
  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate version and release notes
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)
          if [[ ! "$GITHUB_REF_NAME" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ || "$version" != "$GITHUB_REF_NAME" ]]; then
            echo "Release tag must be X.Y.Z and match build.gradle.kts (found '$version')." >&2
            exit 1
          fi
          node scripts/changelog-section.mjs "$GITHUB_REF_NAME"

  test:
    needs: changelog
    uses: ./.github/workflows/ci.yml

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up QEMU and buildx (multi-arch images)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Only move rolling tags forward
        id: latest
        run: |
          versions=$(git tag --list --sort=-version:refname | grep -E '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$')
          highest=$(sed -n '1p' <<< "$versions")
          minor=${GITHUB_REF_NAME%.*}
          highest_patch=$(awk -v prefix="$minor." 'index($0,prefix)==1 {print; exit}' <<< "$versions")
          [[ "$highest" == "$GITHUB_REF_NAME" ]] && latest=true || latest=false
          [[ "$highest_patch" == "$GITHUB_REF_NAME" ]] && latest_patch=true || latest_patch=false
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "latest_patch=$latest_patch" >> "$GITHUB_OUTPUT"

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.latest.outputs.latest_patch }}
            type=raw,value=latest,enable=${{ steps.latest.outputs.latest }}

      - name: Build and push images (amd64 + arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check out the SPK framework
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: moritzfl/synology-docker-bridge
          ref: 471b87a56650c03a2da50c90dcae006b3acf9958
          path: synology-docker-bridge
          persist-credentials: false

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - name: Set up Node.js (SPK generator)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26

      - name: Set up QEMU and buildx for ARM packages
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build the Synology packages
        env:
          FRAMEWORK_DIR: ${{ github.workspace }}/synology-docker-bridge
        run: |
          ARCH=x86_64 ./packaging/pack-framework.sh
          ARCH=armv8 ./packaging/pack-framework.sh

      - name: Checksums for the release assets
        run: |
          mkdir release-assets
          artifact="airplay-capture-$GITHUB_REF_NAME"
          cp "build/libs/$artifact.jar" "packaging/dist/$artifact-x86_64.spk" \
            "packaging/dist/$artifact-armv8.spk" release-assets/
          (cd release-assets && sha256sum -- "$artifact.jar" "$artifact-x86_64.spk" "$artifact-armv8.spk" > release-checksums.txt)

      - name: Release notes from CHANGELOG.md
        run: |
          {
            node scripts/changelog-section.mjs "${GITHUB_REF_NAME}"
            echo
            echo "## Install"
            echo
            echo "- **Synology NAS** (DSM 7.2.1+, Container Manager): install the x86_64 or armv8 \`.spk\` in Package Center → Manual Install. The armv8 package has not yet been tested on a real ARM NAS."
            echo "- **Docker** (linux/amd64, linux/arm64): \`docker run ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}\`"
            echo "- **macOS, Linux, Windows:** download the \`.jar\` and run \`java -jar airplay-capture-${GITHUB_REF_NAME}.jar\`. It needs Java 21 or newer and ffmpeg."
            echo
            echo "SHA-256 checksums: \`release-checksums.txt\`."
          } > release-notes.md

      - name: Create the GitHub Release with the SPK and the jar
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          name: AirPlay Capture ${{ github.ref_name }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: release-assets/*
