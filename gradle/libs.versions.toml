[versions]
spring-boot = "4.1.2"
vaadin = "25.3.4"
jmdns = "3.6.5"
junit = "6.0.0"
archunit = "1.5.1"
spotless = "8.11.0"
# renovate: datasource=npm depName=prettier
prettier-core = "3.9.10"
# renovate: datasource=npm depName=prettier-plugin-java
prettier-java = "2.11.0"

[libraries]
spring-boot-bom = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-jackson = { module = "org.springframework.boot:spring-boot-starter-jackson" }
vaadin-spring-boot-starter = { module = "com.vaadin:vaadin-spring-boot-starter", version.ref = "vaadin" }
jmdns = { module = "org.jmdns:jmdns", version.ref = "jmdns" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
archunit = { module = "com.tngtech.archunit:archunit", version.ref = "archunit" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
vaadin = { id = "com.vaadin", version.ref = "vaadin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
